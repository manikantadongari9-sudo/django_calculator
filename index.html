<!DOCTYPE html>

    <style>
        body {

            width: 90%;
            padding: 12px;
            margin: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 12px 18px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover { background: #7c3aed; }

        .result {
            margin-top: 20px;
            font-size: 25px;
            color: #4f46e5;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>🧮 Django Calculator</h1>

    <form method="POST">
        {% csrf_token %}

        <input type="number" step="any" name="num1"
               placeholder="First Number" required>

        <input type="number" step="any" name="num2"
               placeholder="Second Number" required>

        <br>

        <button name="operation" value="+">+</button>
        <button name="operation" value="-">−</button>
        <button name="operation" value="*">×</button>
        <button name="operation" value="/">÷</button>
    </form>

    {% if result != "" %}
        <div class="result">Result: {{ result }}</div>
    {% endif %}
</div>

</body>
</html>
